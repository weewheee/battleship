<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Battleship</title>
    <link rel="stylesheet" type="text/css" href="../static/css/style.css">
</head>
<body>
<main>
    <script>
        // function to create a 10x10 grid of cells for the game board, used for both player and AI boards
        function createGameBoard(containerId, cellClass) {
            const container = document.getElementById(containerId);
            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 10; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add(`${cellClass}-cell`);
                    cell.id = `${cellClass}-cell-${row}-${col}`;
                    cell.value = `${row}${col}`;
                    container.appendChild(cell);
                }
            }
        }
    </script>
    <h2 id="turn-indicator" onclick=gameOver()></h2>
    <div id="main-container">
        <div id="ai-board-container">
            <script>
                // Dynamically create a 10x10 grid of cells for the AI's game board
                createGameBoard('ai-board-container', 'ai');
            </script>
        </div>
        <div id="player-board-container">
            <script>
                // Dynamically create a 10x10 grid of cells for the player's game board
                createGameBoard('player-board-container', 'player');
            </script>
        </div>
    </div>
    <div class="popup">
        <div id="game-over-message-container">
            <h2 id="game-over-message">Game Over</h2>
            <h3 id="game-over-submessage">You Win!</h3>
            <table id="game-over-stats">
                <tr>
                    <th class="column-header"></th>
                    <th class="row-header">You</th>
                    <th class="row-header">AI</th>
                </tr>
                <tr>
                    <th class="column-header">Misses</th>
                    <td id="player-misses">0</td>
                    <td id="ai-misses">0</td>
                </tr>
                <tr>
                    <th class="column-header">Hits</th>
                    <td id="player-hits">0</td>
                    <td id="ai-hits">0</td>
                </tr>
                <tr>
                    <th class="column-header">Total</th>
                    <td id="player-total">0</td>
                    <td id="ai-total">0</td>
                </tr>
            </table>
            <div id="replay-button" onclick="window.open('/redirect')">Play Again</div>
        </div>
    </div>
</main>
<script>

// obtain game variables from Flask using Jinja templating
const aiBoard = {{ ai_board | tojson }};
const playerBoard = {{ player_board | tojson }};
const shipPlacements = {{ ship_placements | tojson }};
let winner = {{ winner | tojson }};

let playerTurn = true;
let allowPlayerInput = true; 

const hitMarkerColour = '#ff4444';
const missMarkerColour = '#99999f';
const sinkMarkerColour = '#aa4444';

const turnIndicator = document.getElementById('turn-indicator');
const aiBoardContainer = document.getElementById('ai-board-container');
const playerBoardContainer = document.getElementById('player-board-container');
const aiCells = document.querySelectorAll('.ai-cell');
const playerCells = document.querySelectorAll('.player-cell');

const playerStats = {
    hits: 0,
    misses: 0,
    total: 0
}

const aiStats = {
    hits: 0,
    misses: 0,
    total: 0
}

// Initial setup to reload markers on player and AI boards
function reloadMarkers(player, board) {
    for (let row = 0; row < 10; row++) {
        for (let col = 0; col < 10; col++) {
            const cell = document.getElementById(`${player}-cell-${row}-${col}`);

            // helper function to draw marker
            function drawMarker(cell, colour) {
                const marker = document.createElement('div');
                marker.classList.add('marker');
                marker.style.backgroundColor = colour;
                cell.appendChild(marker);
            }

            if (board[row][col] === 'O') {
                drawMarker(cell, missMarkerColour);
            }
            else if (board[row][col] === 'X') {
                drawMarker(cell, hitMarkerColour);
            }
            else if (board[row][col] === 'S') {
                drawMarker(cell, sinkMarkerColour);
            }
        }
    }
}

// Call reloadMarkers for both boards on page load, in case player reloads the page mid-game
reloadMarkers('player', playerBoard);
reloadMarkers('ai', aiBoard);

// Function to show player ships on player board
function showPlayerShips() {
    shipPlacements.forEach(ship => {
        ship.positions.forEach(pos => {
            const cell = document.getElementById(`player-cell-${pos[0]}-${pos[1]}`);
            cell.style.backgroundColor = ship.colour;
        });
    });
}
showPlayerShips(); // Initial call to display player ships

// Function to grey out board depending on whose turn it is
async function updateBoardInteractivity() {
    if (playerTurn) {
        // update turn indicator
        turnIndicator.textContent = "Your Turn";

        // grey out player board
        playerBoardContainer.style.opacity = '0.6';
        playerBoardContainer.style.transform = 'scale(0.6)';

        aiBoardContainer.style.opacity = '1';
        aiBoardContainer.style.transform = 'scale(1)';
        
    } 
    else {
        // update turn indicator
        turnIndicator.textContent = "AI's Turn";
        
        // grey out and shrink AI board
        aiBoardContainer.style.opacity = '0.6';
        aiBoardContainer.style.transform = 'scale(0.6)';

        playerBoardContainer.style.opacity = '1';
        playerBoardContainer.style.transform = 'scale(1)';
    }

    // Set time delay for animation to finish 
    await new Promise(resolve => setTimeout(resolve, 800));

}
updateBoardInteractivity(); // Initial call to set the correct interactivity on page load

// Function to add overlay to cells
function addHoverOverlay(row, col) {
    
    const cell = document.getElementById(`ai-cell-${row}-${col}`);
    if (!allowPlayerInput) return;
    if (cell.querySelector('.marker')) return;
    
    for (let i = 0; i < 10; i++) {
        // add grey overlay to row and column of hovered cell
        const rowCell = document.getElementById(`ai-cell-${row}-${i}`);
        const colCell = document.getElementById(`ai-cell-${i}-${col}`);
        rowCell.style.boxShadow = 'inset 0 0 0 100px #00000040';
        colCell.style.boxShadow = 'inset 0 0 0 100px #00000040';

        // add red overlay to hovered cell
        const hoveredCell = document.getElementById(`ai-cell-${row}-${col}`);
        hoveredCell.style.boxShadow = 'inset 0 0 0 100px #ff000080';
    }
}

// Function to remove overlay from all cells
function removeHoverOverlay() {
    for (let i = 0; i < 10; i++) {
        for (let j = 0; j < 10; j++) {
            const cell = document.getElementById(`ai-cell-${i}-${j}`);
            cell.style.boxShadow = '';
        }
    }
}

// Function to add hit or miss marker on AI/Player board
async function markCell(board, row, col, hit) {
    
    const cell = document.getElementById(`${board}-cell-${row}-${col}`);

    const marker = document.createElement('div');
    marker.classList.add('marker');
    marker.style.backgroundColor = hit ? hitMarkerColour : missMarkerColour;
    
    // add marker to cell
    cell.textContent = '';
    cell.appendChild(marker);

    // wait for marker animation to finish
    await new Promise(resolve => setTimeout(resolve, 300));
}

// Function to toggle turns
async function toggleTurn() {
    playerTurn = !playerTurn;
    await updateBoardInteractivity();
}

// Function to toggle player input
function togglePlayerInput() {
    allowPlayerInput = !allowPlayerInput;

    // Change cursor style based on whether player input is allowed
    aiCells.forEach(cell => {
        cell.style.cursor = allowPlayerInput ? 'pointer' : 'default';
    });
}

// Function to update sunk cells on ai board
async function updateSunkCells(board, sunkPositions) {
    for (const pos of sunkPositions) {
        const cell = document.getElementById(`${board}-cell-${pos[0]}-${pos[1]}`);

        // change colour of hit marker to dark red with pulse animation
        const marker = cell.querySelector('.marker');
        marker.style.backgroundColor = sinkMarkerColour;
        marker.style.animation = 'pulse 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';

        // short delay for wave effect
        await new Promise(resolve => setTimeout(resolve, 100));
    }

    // wait for animation to fully finish
    await new Promise(resolve => setTimeout(resolve, 500));
}

// Function for AI to make move
async function aiMakeMove() {
    while (true) {
        // Send request to Flask backend to get AI move coordinates
        const response = await fetch('/play/ai-move', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        const data = await response.json();

        // Update AI stats in game over popup
        aiStats.hits = data.winStats.hitCount;
        aiStats.misses = data.winStats.missCount;
        aiStats.total = data.winStats.totalAttacks;

        // Update player board based on AI move
        await markCell('player', data.row, data.col, data.hit);

        // Update sunk cells on player board
        if (data.sinkPositions.length > 0) {
            await updateSunkCells('player', data.sinkPositions);
        }

        // Short delay before proceeding with next move or toggling back to player turn
        await new Promise(resolve => setTimeout(resolve, 800));

        // check if game is over
        if (data.winner) {
            winner = data.winner;
            gameOver();
            break;
        }

        // Toggle turn back to player if AI missed
        if (!data.hit) {
            await toggleTurn();
            togglePlayerInput();
            break;
        }
    }
}

// Function to process game over screen
function gameOver() {

    // return if winner is not set
    if (!winner) return;

    // Change submessage depending on who won
    const submessage = document.getElementById('game-over-submessage');
    submessage.textContent = winner === 'player' ? 'You Win!' : 'Better Luck Next Time!';

    // Update values in statistics table
    document.getElementById('player-hits').textContent = playerStats.hits;
    document.getElementById('player-misses').textContent = playerStats.misses;
    document.getElementById('player-total').textContent = playerStats.total;
    document.getElementById('ai-hits').textContent = aiStats.hits;
    document.getElementById('ai-misses').textContent = aiStats.misses;
    document.getElementById('ai-total').textContent = aiStats.total;

    // Fade in popup background
    const popup = document.querySelector('.popup');
    popup.style.zIndex = 1;
    popup.style.display = 'flex';
    popup.style.animation = 'background-fade-in 0.6s ease';

    // Fade in message container from bottom
    const gameOverMessageContainer = document.getElementById('game-over-message-container');
    gameOverMessageContainer.style.animation = 'fade-in-bottom 0.5s ease-out';
    return
}

// Initial game over call in case game is already over when page loads (e.g. player hits refresh mid-game)
gameOver();

// Event listener to add red overlay to cell on hover
aiCells.forEach(cell => {
    cell.addEventListener('mouseover', () => {
        removeHoverOverlay()
        const [_, __, row, col] = cell.id.split('-').map(Number);
        addHoverOverlay(row, col);
    });
});

aiBoardContainer.addEventListener('mouseleave', () => {
    removeHoverOverlay();
});

// Event listener to handle player attacks on click
aiCells.forEach(cell => {

    cell.addEventListener('click', async () => {
        // Prevent player from clicking if it's not their turn or if input is disabled
        if (!playerTurn || !allowPlayerInput) {
            console.log(playerTurn, allowPlayerInput)
            return;
        }

        // Prevent clicking on cells that already have a marker
        if (cell.querySelector('.marker')) return;

        removeHoverOverlay();
        togglePlayerInput();

        const [_, __, row, col] = cell.id.split('-').map(Number);

        // Send attack coordinates to Flask backend via AJAX and await response
        const response = await fetch('/play/player-move', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({'row': row, 'col': col})
        });
        const data = await response.json();

        // Update player stats in game over popup
        playerStats.hits = data.winStats.hitCount;
        playerStats.misses = data.winStats.missCount;
        playerStats.total = data.winStats.totalAttacks;

        // Update AI board based on response
        await markCell('ai', row, col, data.hit);

        // if miss, toggle turn to AI
        if (!data.hit) {
            await toggleTurn();
            await aiMakeMove();
            return
        }
        
        // Update sunk cells on AI board
        if (data.sinkPositions.length > 0) {
            console.log(data.sinkPositions);
            await updateSunkCells('ai', data.sinkPositions);
        }
        
        // check if game is over
        if (data.winner) {
            winner = data.winner;
            gameOver();
        }
        
        // Allow player to make another move if they hit a ship
        await togglePlayerInput();
    }); 
});

</script>
</body>
</html>
