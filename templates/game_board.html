<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Battleship</title>
    <link rel="stylesheet" type="text/css" href="../static/css/style.css">
</head>
<body>
<main>
    <h2 id="turn-indicator"></h2>
    <div id="main-container">
        <div id="ai-board-container">
            <script>
                // Dynamically create a 10x10 grid of cells for the AI's game board
                const aiBoardContainer = document.getElementById('ai-board-container');
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        const cell = document.createElement('div');
                        cell.classList.add('ai-cell');
                        cell.id = `ai-cell-${row}-${col}`;
                        cell.value = `${row}${col}`;
                        aiBoardContainer.appendChild(cell);
                    }
                }
            </script>
        </div>
        <div id="player-board-container">
            <script>
                // Dynamically create a 10x10 grid of cells for the player's game board
                const playerBoardContainer = document.getElementById('player-board-container');
                for (let row = 0; row < 10; row++) {
                    for (let col = 0; col < 10; col++) {
                        const cell = document.createElement('div');
                        cell.classList.add('player-cell');
                        cell.id = `player-cell-${row}-${col}`;
                        cell.value = `${row}${col}`;
                        playerBoardContainer.appendChild(cell);
                    }
                }
            </script>
        </div>
    </div>
</main>
<script>

// obtain game variables from Flask using Jinja templating
const shipPlacements = {{ ship_placements | tojson }};

let playerTurn = true;
let allowPlayerInput = true; 

const turnIndicator = document.getElementById('turn-indicator');
const aiCells = document.querySelectorAll('.ai-cell');
const playerCells = document.querySelectorAll('.player-cell');

// Function to show player ships on player board
function showPlayerShips() {
    shipPlacements.forEach(ship => {
        ship.positions.forEach(pos => {
            const cell = document.getElementById(`player-cell-${pos[0]}-${pos[1]}`);
            cell.style.backgroundColor = ship.colour;
        });
    });
}
showPlayerShips(); // Initial call to display player ships

// Function to grey out board depending on whose turn it is
async function updateBoardInteractivity() {
    if (playerTurn) {
        // update turn indicator
        turnIndicator.textContent = "Your Turn";

        // grey out player board
        playerBoardContainer.style.opacity = '0.6';
        playerBoardContainer.style.transform = 'scale(0.6)';

        aiBoardContainer.style.opacity = '1';
        aiBoardContainer.style.transform = 'scale(1)';
        
    } 
    else {
        // update turn indicator
        turnIndicator.textContent = "AI's Turn";
        
        // grey out and shrink AI board
        aiBoardContainer.style.opacity = '0.6';
        aiBoardContainer.style.transform = 'scale(0.6)';

        playerBoardContainer.style.opacity = '1';
        playerBoardContainer.style.transform = 'scale(1)';
    }

    // Set time delay for animation to finish 
    await new Promise(resolve => setTimeout(resolve, 800));

}
updateBoardInteractivity(); // Initial call to set the correct interactivity on page load

// Function to add overlay to cells
function addHoverOverlay(row, col) {
    
    const cell = document.getElementById(`ai-cell-${row}-${col}`);
    if (!allowPlayerInput) return;
    if (cell.querySelector('.marker')) return;
    
    for (let i = 0; i < 10; i++) {
        // add grey overlay to row and column of hovered cell
        const rowCell = document.getElementById(`ai-cell-${row}-${i}`);
        const colCell = document.getElementById(`ai-cell-${i}-${col}`);
        if (rowCell) rowCell.style.boxShadow = 'inset 0 0 0 100px rgba(0, 0, 0, 0.25)';
        if (colCell) colCell.style.boxShadow = 'inset 0 0 0 100px rgba(0, 0, 0, 0.25)';

        // add red overlay to hovered cell
        const hoveredCell = document.getElementById(`ai-cell-${row}-${col}`);
        if (hoveredCell) hoveredCell.style.boxShadow = 'inset 0 0 0 100px rgba(255, 0, 0, 0.6)';
    }
}

// Function to remove overlay from all cells
function removeHoverOverlay() {
    for (let i = 0; i < 10; i++) {
        for (let j = 0; j < 10; j++) {
            const cell = document.getElementById(`ai-cell-${i}-${j}`);
            if (cell) cell.style.boxShadow = '';
        }
    }
}

// Function to add hit or miss marker on AI/Player board
async function markCell(board, row, col, hit) {
    
    const cell = document.getElementById(`${board}-cell-${row}-${col}`);

    const marker = document.createElement('div');
    marker.classList.add('marker');
    marker.style.backgroundColor = hit ? '#ff4444' : '#99999f';
    
    // add marker to cell
    cell.textContent = '';
    cell.appendChild(marker);

    // wait for marker animation to finish
    await new Promise(resolve => setTimeout(resolve, 300));
}

// Function to toggle turns
async function toggleTurn() {
    playerTurn = !playerTurn;
    await updateBoardInteractivity();
}

// Function to toggle player input
function togglePlayerInput() {
    allowPlayerInput = !allowPlayerInput;

    // Change cursor style based on whether player input is allowed
    aiCells.forEach(cell => {
        cell.style.cursor = allowPlayerInput ? 'pointer' : 'default';
    });
}

// Function to update sunk cells on ai board
async function updateSunkCells(board, sunkPositions) {
    for (const pos of sunkPositions) {
        const cell = document.getElementById(`${board}-cell-${pos[0]}-${pos[1]}`);  //! figure put why this returns null

        // change colour of hit marker to dark red with pulse animation
        const marker = cell.querySelector('.marker');
        marker.style.backgroundColor = '#aa4444';
        marker.style.animation = 'pulse 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';

        // short delay for wave effect
        await new Promise(resolve => setTimeout(resolve, 100));
    }

    // wait for animation to fully finish
    await new Promise(resolve => setTimeout(resolve, 500));
}

// Function for AI to make move
async function aiMakeMove() {
    while (true) {
        // Send request to Flask backend to get AI move coordinates
        const response = await fetch('/play/ai-move', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        const data = await response.json();

        // Update player board based on AI move
        await markCell('player', data.row, data.col, data.hit);

        // Update sunk cells on player board
        if (data.sinkPositions.length > 0) {
            await updateSunkCells('player', data.sinkPositions);
        }

        // Short delay before proceeding with next move or toggling back to player turn
        await new Promise(resolve => setTimeout(resolve, 800));

        // check if game is over
        if (data.win) {
            //TODO: Handle game over logic
            alert("Game Over! AI Wins!");
            break;
        }

        // Toggle turn back to player if AI missed
        if (!data.hit) {
            await toggleTurn();
            togglePlayerInput();
            break;
        }
    }
}


// Event listener to add red overlay to cell on hover
aiCells.forEach(cell => {
    cell.addEventListener('mouseover', () => {
        removeHoverOverlay()
        const [_, __, row, col] = cell.id.split('-').map(Number);
        addHoverOverlay(row, col);
    });
});

aiBoardContainer.addEventListener('mouseleave', () => {
    removeHoverOverlay();
});

// Event listener to handle player attacks on click
aiCells.forEach(cell => {
    cell.addEventListener('click', async () => {
        if (!playerTurn || !allowPlayerInput) return;

        removeHoverOverlay();
        togglePlayerInput();

        const [_, __, row, col] = cell.id.split('-').map(Number);

        // Send attack coordinates to Flask backend via AJAX and await response
        const response = await fetch('/play/player-move', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({"row": row, "col": col})
        });
        const data = await response.json();

        // Update AI board based on response
        await markCell('ai', row, col, data.hit);

        // if miss, toggle turn to AI
        if (!data.hit) {
            await toggleTurn();
            await aiMakeMove();
            return
        }
        
        // Update sunk cells on AI board
        if (data.sinkPositions.length > 0) {
            console.log(data.sinkPositions);
            await updateSunkCells('ai', data.sinkPositions);
        }
        
        // check if game is over
        if (data.win) {
            // TODO: Handle game over logic
            alert("Game Over! You Win!");
        }
        
        // Allow player to make another move if they hit a ship
        await togglePlayerInput();
    }, { once: true }); // Use { once: true } to ensure the event listener is only triggered once per cell
});

</script>
</body>
</html>
